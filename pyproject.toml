[project]
name = "glow"
version = "0.1.0"
description = "GLow - A Flower Based Gossip Learning Strategy"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [
    {name = "Aitor Belenguer"}
]
keywords = ["federated-learning", "gossip-learning", "flower", "machine-learning"]

dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchmetrics==1.9.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "pyyaml==6.0.3",
    "matplotlib==3.10.8",
    "setuptools==84.0.0",
    "flwr[simulation]==1.30.0",
    "scipy==1.15.3"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "client",
    "datasets",
    "main",
    "models",
    "server",
]

[tool.setuptools.packages.find]
include = ["custom_strategies*", "flwr_lib_modifications*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # allow raise without from in exception handlers
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# TODO: setup this for some basic tests
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing --cov-report=html"
